<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Vista -->
  <g>
    <rect x="250" y="30" width="180" height="64" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="340" y="57" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">VISTA</text>
    <text x="340" y="78" text-anchor="middle" font-size="12" fill="#5b21b6">interfaz de usuario</text>
  </g>

  <!-- Controlador -->
  <g>
    <rect x="60" y="170" width="190" height="64" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">CONTROLADOR</text>
    <text x="155" y="218" text-anchor="middle" font-size="12" fill="#1e40af">gestiona entradas</text>
  </g>

  <!-- Modelo -->
  <g>
    <rect x="430" y="170" width="190" height="64" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">MODELO</text>
    <text x="525" y="218" text-anchor="middle" font-size="12" fill="#166534">datos + l&#243;gica</text>
  </g>

  <!-- Usuario -->
  <g>
    <ellipse cx="340" cy="380" rx="70" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="340" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">USUARIO</text>
  </g>

  <!-- Flechas del ciclo -->
  <line x1="252" y1="212" x2="330" y2="98" stroke="#334155" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="222" y="150" font-size="12" fill="#64748b">1. interact&#250;a /</text>
  <text x="222" y="166" font-size="12" fill="#64748b">solicita</text>

  <line x1="255" y1="202" x2="424" y2="202" stroke="#334155" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="292" y="192" font-size="12" fill="#64748b">2. actualiza datos</text>

  <line x1="522" y1="168" x2="436" y2="100" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrM)"/>
  <text x="452" y="140" font-size="12" fill="#64748b">3. notifica cambio</text>

  <line x1="300" y1="98" x2="310" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="318" y="240" font-size="12" fill="#64748b">4. presenta</text>
  <text x="318" y="256" font-size="12" fill="#64748b">informaci&#243;n</text>

  <text x="80" y="420" font-size="12" fill="#94a3b8">Flecha punteada: notificaci&#243;n pasiva (patr&#243;n observaci&#243;n)</text>
</svg>
