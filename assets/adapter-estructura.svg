<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="tri3" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Cliente -->
  <g>
    <rect x="40" y="60" width="140" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="110" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Cliente</text>
  </g>

  <!-- Interfaz Objetivo -->
  <g>
    <rect x="250" y="45" width="190" height="86" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 4"/>
    <line x1="250" y1="77" x2="440" y2="77" stroke="#4338ca" stroke-width="1.5"/>
    <text x="345" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">&#171;interface&#187; Objetivo</text>
    <text x="262" y="101" font-size="13" fill="#1e293b">+ operar()</text>
  </g>

  <!-- Adaptado (legado) -->
  <g>
    <rect x="500" y="45" width="160" height="86" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="500" y1="77" x2="660" y2="77" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="580" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Adaptado</text>
    <text x="512" y="101" font-size="13" fill="#1e293b">+ metodoEspecifico()</text>
  </g>

  <!-- Adaptador -->
  <g>
    <rect x="290" y="240" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <line x1="290" y1="272" x2="470" y2="272" stroke="#059669" stroke-width="1.5"/>
    <text x="380" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Adaptador</text>
    <text x="302" y="296" font-size="13" fill="#1e293b">+ operar() {</text>
    <text x="316" y="316" font-size="13" fill="#1e293b">adaptado.metodoEspecifico()</text>
    <text x="302" y="330" font-size="13" fill="#1e293b">}</text>
  </g>

  <!-- Flechas -->
  <line x1="182" y1="88" x2="244" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="400" y1="240" x2="362" y2="137" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tri3)"/>
  <polygon points="474,285 492,277 510,285 492,293" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <line x1="510" y1="283" x2="552" y2="135" stroke="#334155" stroke-width="2"/>
  <text x="520" y="215" font-size="12" fill="#64748b">envuelve / delega</text>
</svg>
