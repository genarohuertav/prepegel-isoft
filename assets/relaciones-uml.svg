<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>

  <!-- ===== Panel 1: agregación ===== -->
  <circle cx="45" cy="55" r="16" fill="#4338ca"/>
  <text x="45" y="61" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text>
  <rect x="90" y="32" width="120" height="46" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Equipo</text>
  <polygon points="212,55 226,47 240,55 226,63" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="54" x2="320" y2="54" stroke="#334155" stroke-width="2"/>
  <rect x="322" y="31" width="120" height="46" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2"/>
  <text x="382" y="59" text-anchor="middle" font-size="14" fill="#312e81">Jugador</text>
  <text x="280" y="42" text-anchor="middle" font-size="12" fill="#64748b">1&#160;&#160;&#160;&#160;&#160;5..11</text>
  <line x1="430" y1="54" x2="560" y2="54" stroke="none"/>
  <text x="580" y="60" font-size="13" fill="#94a3b8">rombo hueco</text>

  <!-- ===== Panel 2: composición ===== -->
  <circle cx="45" cy="145" r="16" fill="#4338ca"/>
  <text x="45" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text>
  <rect x="90" y="122" width="120" height="46" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Casa</text>
  <polygon points="212,145 226,137 240,145 226,153" fill="#334155" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="144" x2="320" y2="144" stroke="#334155" stroke-width="2"/>
  <rect x="322" y="121" width="120" height="46" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2"/>
  <text x="382" y="149" text-anchor="middle" font-size="14" fill="#312e81">Habitaci&#243;n</text>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#64748b">1&#160;&#160;&#160;&#160;&#160;*</text>
  <text x="580" y="150" font-size="13" fill="#94a3b8">rombo lleno</text>

  <!-- ===== Panel 3: herencia ===== -->
  <circle cx="45" cy="245" r="16" fill="#4338ca"/>
  <text x="45" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text>

  <!-- Padre -->
  <rect x="90" y="205" width="130" height="44" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="155" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Vehiculo</text>

  <!-- Triángulo hueco apuntando al padre (abajo del padre) -->
  <path d="M148,272 L162,272 L155,256 z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <!-- Bus vertical/horizontal -->
  <line x1="155" y1="272" x2="155" y2="292" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="292" x2="235" y2="292" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="292" x2="105" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="235" y1="292" x2="235" y2="300" stroke="#334155" stroke-width="2"/>

  <!-- Hijos -->
  <rect x="62" y="300" width="86" height="36" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2"/>
  <text x="105" y="323" text-anchor="middle" font-size="13" fill="#312e81">Auto</text>
  <rect x="192" y="300" width="86" height="36" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2"/>
  <text x="235" y="323" text-anchor="middle" font-size="13" fill="#312e81">Moto</text>

  <text x="330" y="225" font-size="13.5" fill="#334155">tri&#225;ngulo hueco apunta</text>
  <text x="330" y="244" font-size="13.5" fill="#334155">hacia la clase padre;</text>
  <text x="330" y="263" font-size="13.5" fill="#334155">los hijos heredan sus</text>
  <text x="330" y="282" font-size="13.5" fill="#334155">atributos y m&#233;todos</text>
</svg>
