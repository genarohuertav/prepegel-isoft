<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <!-- Clase Singleton -->
  <g>
    <rect x="190" y="60" width="300" height="170" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <line x1="190" y1="94" x2="490" y2="94" stroke="#4338ca" stroke-width="1.5"/>
    <line x1="190" y1="176" x2="490" y2="176" stroke="#4338ca" stroke-width="1.5"/>
    <text x="340" y="83" text-anchor="middle" font-size="17" font-weight="bold" font-style="italic" fill="#312e81">Singleton</text>
    <text x="204" y="118" font-size="13" fill="#1e293b" text-decoration="underline">- instancia: Singleton {static}</text>
    <text x="204" y="140" font-size="13" fill="#1e293b" text-decoration="underline">- Singleton()   &#171;constructor&#187;</text>
    <text x="204" y="202" font-size="13" fill="#1e293b" text-decoration="underline">+ getInstance(): Singleton {static}</text>
  </g>

  <!-- Anotaciones -->
  <g font-size="13" fill="#64748b">
    <line x1="495" y1="140" x2="540" y2="120" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="546" y="116">constructor</text>
    <text x="546" y="134">privado:</text>
    <text x="546" y="152">&#8594; nadie m&#225;s</text>
    <text x="546" y="170">puede hacer new</text>

    <line x1="495" y1="205" x2="540" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="546" y="228">acceso global</text>
    <text x="546" y="246">al &#250;nico punto;</text>
    <text x="546" y="264">crea la instancia</text>
    <text x="546" y="282">si a&#250;n no existe</text>
  </g>

  <!-- Cliente -->
  <g>
    <rect x="60" y="270" width="150" height="50" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2"/>
    <text x="135" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Cliente</text>
  </g>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <line x1="180" y1="268" x2="240" y2="236" stroke="#334155" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text x="196" y="242" font-size="12" fill="#64748b">Singleton.getInstance()</text>
</svg>
