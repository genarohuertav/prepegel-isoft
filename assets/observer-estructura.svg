<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="tri" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Sujeto abstracto -->
  <g>
    <rect x="40" y="50" width="240" height="120" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <line x1="40" y1="82" x2="280" y2="82" stroke="#4338ca" stroke-width="1.5"/>
    <text x="160" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#312e81">Sujeto</text>
    <text x="52" y="102" font-size="13" fill="#1e293b">- observadores[]</text>
    <text x="52" y="124" font-size="13" fill="#1e293b">+ adjuntar(o: Observador)</text>
    <text x="52" y="144" font-size="13" fill="#1e293b">+ quitar(o: Observador)</text>
    <text x="52" y="164" font-size="13" fill="#1e293b">+ notificar()</text>
  </g>

  <!-- Interfaz Observador -->
  <g>
    <rect x="420" y="40" width="220" height="70" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 4"/>
    <line x1="420" y1="72" x2="640" y2="72" stroke="#4338ca" stroke-width="1.5"/>
    <text x="530" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">&#171;interface&#187; Observador</text>
    <text x="432" y="96" font-size="13" fill="#1e293b">+ actualizar()</text>
  </g>

  <!-- SujetoConcreto -->
  <g>
    <rect x="40" y="300" width="240" height="100" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2"/>
    <line x1="40" y1="330" x2="280" y2="330" stroke="#4338ca" stroke-width="1.5"/>
    <text x="160" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">SujetoConcreto</text>
    <text x="52" y="352" font-size="13" fill="#1e293b">- estado</text>
    <text x="52" y="374" font-size="13" fill="#1e293b">+ obtenerEstado()</text>
    <text x="52" y="394" font-size="13" fill="#1e293b">+ cambiarEstado()</text>
  </g>

  <!-- Observadores concretos -->
  <g>
    <rect x="430" y="250" width="210" height="56" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2"/>
    <text x="535" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">ObservadorConcretoA</text>
    <text x="442" y="294" font-size="13" fill="#1e293b">+ actualizar()</text>
  </g>
  <g>
    <rect x="430" y="340" width="210" height="56" rx="10" fill="#fff" stroke="#4338ca" stroke-width="2"/>
    <text x="535" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">ObservadorConcretoB</text>
    <text x="442" y="384" font-size="13" fill="#1e293b">+ actualizar()</text>
  </g>

  <!-- Herencia Sujeto -->
  <line x1="160" y1="300" x2="160" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#tri)"/>

  <!-- Realizaciones (dashed) -->
  <line x1="500" y1="250" x2="520" y2="116" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tri)"/>
  <line x1="560" y1="340" x2="545" y2="116" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tri)"/>

  <!-- Agregación Sujeto -> Observador -->
  <polygon points="288,105 306,97 324,105 306,113" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <line x1="324" y1="103" x2="418" y2="85" stroke="#334155" stroke-width="2"/>
  <text x="300" y="88" font-size="12" fill="#64748b">1</text>
  <text x="392" y="76" font-size="12" fill="#64748b">*</text>

  <!-- Asociación consulta estado -->
  <line x1="430" y1="290" x2="286" y2="322" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="300" y="288" font-size="12" fill="#64748b">consulta estado</text>
</svg>
