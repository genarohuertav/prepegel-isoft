<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Tabla CLIENTE -->
  <g>
    <!-- Header -->
    <rect x="60" y="50" width="440" height="44" rx="8" fill="#4338ca"/>
    <text x="280" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">CLIENTE</text>

    <!-- Columna nombres -->
    <rect x="60" y="94" width="180" height="40" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="60" y="134" width="180" height="40" fill="#fff" stroke="#c7d2fe"/>
    <rect x="60" y="174" width="180" height="40" fill="#fff" stroke="#c7d2fe"/>

    <!-- Columna valores -->
    <rect x="240" y="94" width="260" height="40" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="240" y="134" width="260" height="40" fill="#fff" stroke="#c7d2fe"/>
    <rect x="240" y="174" width="260" height="40" fill="#fff" stroke="#c7d2fe"/>

    <text x="74" y="119" font-size="14" font-weight="bold" fill="#312e81">id_cliente &#128273;</text>
    <text x="254" y="119" font-size="13" fill="#334155">1</text>
    <text x="74" y="159" font-size="13" fill="#334155">nombre</text>
    <text x="254" y="159" font-size="13" fill="#334155">Ana Torres</text>
    <text x="74" y="199" font-size="13" fill="#334155">telefonos</text>
    <text x="254" y="199" font-size="12.5" fill="#b91c1c">5512345678; 5598765432; 5611223344</text>
  </g>

  <!-- Resaltado del problema -->
  <rect x="240" y="174" width="260" height="40" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 4" rx="3"/>

  <!-- Anotación -->
  <line x1="504" y1="194" x2="556" y2="150" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrE)"/>
  <g font-size="13.5" fill="#b91c1c">
    <text x="500" y="120">&#9888; varios valores en</text>
    <text x="500" y="140">UNA sola celda</text>
  </g>

  <!-- Nota pie -->
  <text x="60" y="290" font-size="13" fill="#64748b">Tabla propuesta para el sistema de atenci&#243;n a clientes.</text>
  <text x="60" y="310" font-size="13" fill="#64748b">Un cliente puede tener de 1 a N n&#250;meros telef&#243;nicos.</text>
</svg>
